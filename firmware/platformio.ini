; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

; Unflags older standards to ensure gnu++17 takes priority
build_unflags = -std=gnu++11 -std=gnu++14

; Added -std=gnu++17 to enable inline constexpr and std::size
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -DUSER_SETUP_LOADED=1   ; use these flags
    -DST7796_DRIVER=1       ; display's controller
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_SCLK=7            ; D8, SCL
    -DTFT_MOSI=9            ; D10, SDA
    -DTFT_MISO=8            ; D9, SDO (set to -1 if unwired)
    -DTFT_CS=2              ; D1
    -DTFT_DC=3              ; D2
    -DTFT_RST=4             ; D3
    -DTFT_BL=5              ; D4
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1            ; built-in fonts
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=1         ; needed for custom (VLW) fonts
    -DSPI_FREQUENCY=40000000

lib_deps = 
    tzapu/WiFiManager
    bblanchon/ArduinoJson@^7
    lovyan03/LovyanGFX@^1.2.0
    bodmer/TFT_eSPI@^2.5.43