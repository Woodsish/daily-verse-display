name: Daily Verse
on:
    schedule:
        - cron: "14 11 * * *" # Runs at 11:00 AM UTC (4:00 AM PST)
    workflow_dispatch: # Allows manual triggering
permissions:
    contents: write
jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v6
              with: {python-version: "3.12"}
            - run: pip install requests beautifulsoup4 pillow
            - name: Test Bible.com access with curl
              run: |
                curl --silent --show-error --location --max-time 30 \
                  --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
                  --header "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
                  --header "Accept-Language: en-US,en;q=0.5" \
                  --dump-header - \
                  --output /dev/null \
                  --write-out "\nHTTP %{http_code}\n" \
                  https://www.bible.com/verse-of-the-day
            - run: python scripts/fetch_verse.py
              env:
                YVP_APP_KEY: ${{secrets.YVP_APP_KEY}}
            - run: |
                git config user.name "verse-bot"
                git config user.email "verse-bot@users.noreply.github.com"
                git add data/
                git diff --staged --quiet || git commit -m "Update verse $(date -u +%F)"
                git push