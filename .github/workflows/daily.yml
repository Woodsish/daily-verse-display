name: Daily Verse
on:
    schedule:
        - cron: "0 9 * * *" # Runs at 9:00 AM UTC (2:00 AM PST)
    workflow_dispatch: # Allows manual triggering
permissions:
    contents: write
jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with: {python-version: "3.12"}
            - run: pip install requests beautifulsoup4
            - run: python scripts/fetch_verse.py
              env:
                YVP_APP_KEY: ${{secrets.YVP_APP_KEY}}
            - run: |
                git config user.name "verse-bot"
                git config user.email "verse-bot@users.noreply.github.com"
                git add data/
                git diff --staged --quiet || git commit -m "Update verse $(date -u +%F)"
                git push