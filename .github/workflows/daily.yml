name: Daily Verse
on:
    schedule:
        - cron: "14 11 * * *" # Scheduled at 11:14 AM UTC (3/4:14 AM Pacifc). Also triggered externally by cron-job
    workflow_dispatch: # Allows manual triggering
permissions:
    contents: write
jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v6
              with: {python-version: "3.12"}
            - run: pip install requests pillow
            - run: python scripts/fetch_verse.py
              env:
                YVP_APP_KEY: ${{secrets.YVP_APP_KEY}}
            - run: |
                git config user.name "verse-bot"
                git config user.email "verse-bot@users.noreply.github.com"
                git add data/
                git diff --staged --quiet || git commit -m "Update verse $(date -u +%F)"
                git push